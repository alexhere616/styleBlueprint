<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore Designers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --neon-green: #39FF14;
    }
  </style>
</head>
<body class="bg-black text-white py-10 px-4">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-4xl font-extrabold text-center text-[var(--neon-green)] mb-8">Explore Designer Portfolios</h1>
    <div id="portfolioList" class="grid gap-6 grid-cols-1 sm:grid-cols-2 md:grid-cols-3"></div>
  </div>

  <script>
const portfolios = JSON.parse(localStorage.getItem("portfolios")) || [];
console.log('------', portfolios);
const container = document.getElementById("portfolioList");
// Define download function once
function downloadPDF(base64Data, filename) {
  if (!base64Data) {
    alert("No PDF available to download.");
    return;
  }

  // Check if it's already a data URL
  const dataUrl = base64Data.startsWith("data:application/pdf;base64,")
    ? base64Data
    : `data:application/pdf;base64,${base64Data}`;

  const link = document.createElement('a');
  link.href = dataUrl;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

portfolios.forEach((p, index) => {
  console.log('localStorage----p---', p);

  const card = document.createElement('div');
  card.className = "bg-neutral-900 border border-[var(--neon-green)] rounded shadow hover:scale-105 transition cursor-pointer w-64";

  card.onclick = () => window.location.href = `profile.html?id=${p.id}`;

  // Avoid attaching large Base64 string in HTML
  let imageSection = '';
  if (p.images && p.images.length > 0) {
    imageSection = `
      <img src="${p.images[0]}" 
           class="w-full h-48 object-cover rounded-t"
           style="cursor: pointer;"
           data-index="${index}"
           onclick="event.stopPropagation(); downloadPortfolioPDF(${index});"
      />
    `;
  } else {
    imageSection = `
      <div class="w-full h-48 bg-gray-800 flex items-center justify-center rounded-t text-gray-500 text-sm">
        No Image
      </div>
    `;
  }

  card.innerHTML = `
    ${imageSection}
    <div class="p-4">
      <h2 class="text-xl font-semibold text-[var(--neon-green)]">${p.name}</h2>
    </div>
  `;

  container.appendChild(card);
});

// Global function to call from onclick
function downloadPortfolioPDF(index) {
  const portfolios = JSON.parse(localStorage.getItem("portfolios")) || [];
  const p = portfolios[index];
  if (p && p.pdfBase64) {
    const filename = `${p.name || "portfolio"}.pdf`;
    downloadPDF(p.pdfBase64, filename);
  } else {
    alert("No PDF found for this portfolio.");
  }
}
</script>

</body>
</html>
