<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --neon-green: #39FF14;
    }
  </style>
</head>
<body class="bg-black text-white py-12 px-4">
  <div class="max-w-2xl mx-auto bg-neutral-900 p-6 rounded shadow-xl">
    <h2 class="text-3xl font-bold mb-4 text-[var(--neon-green)]">Submit Your Portfolio</h2>
    <form id="portfolioForm">
      <input type="text" id="name" placeholder="Your Name" class="mb-4 w-full p-2 bg-black border border-[var(--neon-green)] rounded text-white placeholder-white" required />
      <textarea id="bio" placeholder="Write about your experience, your designs, and yourself" class="mb-4 w-full p-2 bg-black border border-[var(--neon-green)] rounded text-white placeholder-white" rows="5" required></textarea>
      
      <label class="block mb-2 text-sm">Upload PDF Portfolio:</label>
      <input type="file" id="pdf" accept="application/pdf" class="mb-4 w-full p-2 bg-black text-white" />

      <label class="block mb-2 text-sm">Upload Images (up to 3):</label>
      <input type="file" id="images" accept="image/*" multiple class="mb-4 w-full p-2 bg-black text-white" />

      <button type="submit" class="w-full bg-[var(--neon-green)] text-black font-semibold py-2 rounded hover:brightness-110">Submit</button>
    </form>
  </div>

  <!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
  // 🔑 Your Firebase configuration (replace with your actual config)
  const firebaseConfig = {
  apiKey: "AIzaSyBRPwnjLLMnObHi41IMa65joTELt1RCdf8",
  authDomain: "styleblueprint-1ab4c.firebaseapp.com",
  databaseURL: "https://styleblueprint-1ab4c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "styleblueprint-1ab4c",
  storageBucket: "styleblueprint-1ab4c.firebasestorage.app",
  messagingSenderId: "63085658670",
  appId: "1:63085658670:web:156d5007bbeb838931d5bf",
  measurementId: "G-PDKDL8Y2G8"
};

  // 🔌 Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // 📥 Handle Form Submission
  document.getElementById("portfolioForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const bio = document.getElementById("bio").value;
    const pdfFile = document.getElementById("pdf").files[0];
    const imageFiles = document.getElementById("images").files;

    // Convert files to base64
    const reader = file => new Promise(resolve => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.readAsDataURL(file);
    });

    const pdfBase64 = pdfFile ? await reader(pdfFile) : null;
    const imageBase64s = [];
    for (let i = 0; i < Math.min(imageFiles.length, 3); i++) {
      imageBase64s.push(await reader(imageFiles[i]));
    }

    // 📦 Create portfolio object
    const portfolioEntry = {
      name,
      bio,
      pdf: pdfBase64,
      images: imageBase64s,
      timestamp: Date.now()
    };

    // 🔥 Save to Firebase
    try {
      await db.ref("portfolios").push(portfolioEntry);
      console.log("✅ Portfolio uploaded to Firebase");
    } catch (error) {
      console.error("❌ Firebase upload failed:", error);
    }

    // 💾 Optional: Still save to localStorage (if needed)
    let portfolios = JSON.parse(localStorage.getItem("portfolios")) || [];
    portfolios.push({ ...portfolioEntry, id: portfolios.length });
    localStorage.setItem("portfolios", JSON.stringify(portfolios));

    //➡️ Redirect to Explore page
    window.location.href = "explore.html";
  });
</script>

</body>
</html>
